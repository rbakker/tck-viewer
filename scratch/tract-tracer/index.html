<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tract Tracer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080b0f;--panel:#0c1018;--border:#1a2030;
  --accent:#4af;--accent2:#f84;--dim:#2a3545;
  --text:#8899aa;--bright:#ccdde8;
  --sag:#3af8cc;--cor:#f8a03a;--axi:#a03af8;
}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;
  display:flex;height:100vh;overflow:hidden;font-size:11px;}

/* ── PANELS ── */
#left,#right{width:33.333%;display:flex;flex-direction:column;background:var(--panel);flex-shrink:0;}
#left{border-right:1px solid var(--border);}
#right{border-left:1px solid var(--border);}
#left .slice-row,#right .slice-row{flex:1;min-height:0;}
#middle{flex:1;position:relative;overflow:hidden;}
#three-canvas{width:100%;height:100%;display:block;}

/* ── SLICE ROWS ── */
.slice-row{display:flex;flex-direction:column;position:relative;border-bottom:1px solid var(--border);}
.slice-row:last-of-type{border-bottom:none;}
.slice-label{position:absolute;top:6px;left:8px;z-index:2;letter-spacing:0.15em;
  font-size:10px;font-weight:500;pointer-events:none;}
.slice-label.sag{color:var(--sag);}
.slice-label.cor{color:var(--cor);}
.slice-label.axi{color:var(--axi);}
.slice-coord{position:absolute;top:6px;right:8px;z-index:2;color:var(--dim);
  font-size:10px;pointer-events:none;}
.slice-canvas{width:100%;height:100%;display:block;cursor:crosshair;}

/* ── CONTROL STRIPS ── */
.ctl-strip{display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  background:rgba(8,11,15,0.85);border-top:1px solid var(--border);flex-shrink:0;}
.ctl-row{display:flex;align-items:center;gap:6px;}
.ctl-row label{color:var(--dim);letter-spacing:0.1em;font-size:9px;white-space:nowrap;min-width:42px;}
.ctl-row input[type=range]{flex:1;accent-color:var(--accent2);min-width:0;}
.ctl-val{color:var(--text);font-size:9px;min-width:38px;text-align:right;}

/* ── ROTATION STRIP (bottom of middle panel) ── */
#rot-strip{position:absolute;bottom:0;left:0;right:0;z-index:2;
  display:flex;flex-direction:row;align-items:center;gap:0;
  background:rgba(8,11,15,0.82);border-top:1px solid var(--border);
  padding:5px 10px;pointer-events:all;flex-wrap:nowrap;}
#rot-sliders{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
#rot-strip .ctl-row{gap:4px;min-width:0;}
#rot-strip .ctl-row label{min-width:28px;font-size:9px;color:var(--dim);letter-spacing:0.1em;}
#rot-strip .ctl-row input{accent-color:var(--accent);min-width:0;}
#rot-strip .ctl-val{min-width:26px;font-size:9px;}
#rot-strip-right{display:flex;flex-direction:column;gap:4px;
  padding-left:10px;border-left:1px solid var(--border);margin-left:6px;flex-shrink:0;}
/* plane toggle pills */
.plane-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.plane-toggle input[type=checkbox]{display:none;}
.plane-toggle .pill{width:26px;height:12px;border-radius:6px;border:1px solid;
  position:relative;transition:background 0.15s;}
.plane-toggle .pill::after{content:'';position:absolute;top:1px;left:1px;
  width:8px;height:8px;border-radius:50%;background:#fff;transition:left 0.15s;}
.plane-toggle input:checked + .pill::after{left:15px;}
.plane-toggle input:checked + .pill{opacity:1;}
.plane-toggle input:not(:checked) + .pill{background:transparent!important;opacity:0.4;}
.plane-toggle span{font-size:9px;letter-spacing:0.1em;}
.pt-sag .pill{border-color:var(--sag);background:var(--sag);}
.pt-cor .pill{border-color:var(--cor);background:var(--cor);}
.pt-axi .pill{border-color:var(--axi);background:var(--axi);}

/* ── MIDDLE HUD ── */
#middle-hud{position:absolute;inset:0;pointer-events:none;}
#stats{position:absolute;top:16px;right:16px;text-align:right;line-height:2;color:var(--dim);}
#coord-hud{position:absolute;bottom:20px;right:16px;text-align:right;line-height:1.8;color:var(--dim);}
#coord-hud span{color:var(--text);}
#middle-info{position:absolute;top:16px;left:16px;line-height:2;color:var(--border);}
#middle-info span{color:var(--dim);}
#mprogress{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--dim);letter-spacing:0.2em;text-align:center;line-height:2;}

/* ── LOAD OVERLAY ── */
#load-overlay{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:20px;z-index:10;
  background:rgba(8,11,15,0.92);}
#load-overlay h2{color:var(--bright);letter-spacing:0.3em;font-size:12px;font-weight:400;}
.drop-zone{border:1px solid var(--border);padding:2rem 2.5rem;text-align:center;
  cursor:pointer;transition:border-color 0.2s;min-width:180px;}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);}
.drop-zone .tag{color:var(--accent);font-size:10px;margin-bottom:4px;}
.drop-zone .name{color:var(--bright);margin:4px 0;}
.drop-zone p{color:var(--dim);font-size:10px;margin-top:4px;}
input[type=file]{display:none;}
</style>
</head>
<body>

<!-- LEFT: slice viewers A + controls -->
<div id="left">
  <div class="slice-row" id="row-sag">
    <div class="slice-label sag">SAG·A</div>
    <div class="slice-coord" id="coord-sag">—</div>
    <canvas class="slice-canvas" id="cvs-sag"></canvas>
  </div>
  <div class="slice-row" id="row-cor">
    <div class="slice-label cor">COR·A</div>
    <div class="slice-coord" id="coord-cor">—</div>
    <canvas class="slice-canvas" id="cvs-cor"></canvas>
  </div>
  <div class="slice-row" id="row-axi">
    <div class="slice-label axi">AXI·A</div>
    <div class="slice-coord" id="coord-axi">—</div>
    <canvas class="slice-canvas" id="cvs-axi"></canvas>
  </div>
  <!-- Probe controls -->
  <div class="ctl-strip" id="probe-strip">
    <div class="ctl-row">
      <label>RADIUS</label>
      <input type="range" id="radius-slider" min="1" max="30" value="5" step="0.5">
      <span class="ctl-val" id="radius-val">5.0 mm</span>
    </div>
    <div class="ctl-row">
      <label>ENDS·A</label>
      <input type="range" id="probe-ends-slider" min="0" max="30" value="0" step="0.5">
      <span class="ctl-val" id="probe-ends-val">off</span>
    </div>
  </div>
  <!-- Rotation controls -->
</div>

<!-- MIDDLE: 3D view -->
<div id="middle">
  <canvas id="three-canvas"></canvas>
  <!-- load overlay -->
  <div id="load-overlay">
    <h2>TRACT TRACER</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
      <div class="drop-zone" id="dz-nii" onclick="document.getElementById('fi-nii').click()">
        <div class="tag">ANATOMY</div>
        <div class="name">.nii / .nii.gz</div>
        <p>drop or click</p>
        <input type="file" id="fi-nii" accept=".nii,.gz">
      </div>
      <div class="drop-zone" id="dz-tck" onclick="document.getElementById('fi-tck').click()">
        <div class="tag">TRACTOGRAM</div>
        <div class="name">.tck</div>
        <p>drop or click</p>
        <input type="file" id="fi-tck" accept=".tck">
      </div>
    </div>
    <div id="mprogress"></div>
  </div>
  <div id="middle-hud" style="display:none;">
    <div id="middle-info">
      <div><span>DRAG</span> rotate &nbsp; <span>RIGHT</span> pan &nbsp; <span>SCROLL</span> zoom</div>
      <div><span>CLICK SLICES</span> move probe &nbsp; <span>SCROLL SLICES</span> step slice</div>
    </div>
    <div id="stats">
      <div id="stat-total"></div>
      <div id="stat-sel"></div>
    </div>
    <div id="coord-hud">
      X <span id="hud-x">—</span> &nbsp;
      Y <span id="hud-y">—</span> &nbsp;
      Z <span id="hud-z">—</span> mm
    </div>
  </div>
  <!-- Rotation strip at bottom of 3D view -->
  <div id="rot-strip">
    <div id="rot-sliders">
      <div class="ctl-row">
        <label>PITCH</label>
        <input type="range" id="pitch-slider" min="-90" max="90" value="0" step="1">
        <span class="ctl-val" id="pitch-val">0°</span>
      </div>
      <div class="ctl-row">
        <label>YAW</label>
        <input type="range" id="yaw-slider" min="-90" max="90" value="0" step="1">
        <span class="ctl-val" id="yaw-val">0°</span>
      </div>
      <div class="ctl-row">
        <label>ROLL</label>
        <input type="range" id="roll-slider" min="-90" max="90" value="0" step="1">
        <span class="ctl-val" id="roll-val">0°</span>
      </div>
    </div>
    <div id="rot-strip-right">
      <label class="plane-toggle pt-sag">
        <input type="checkbox" id="tog-sag" checked>
        <div class="pill"></div>
        <span style="color:var(--sag)">SAG</span>
      </label>
      <label class="plane-toggle pt-cor">
        <input type="checkbox" id="tog-cor" checked>
        <div class="pill"></div>
        <span style="color:var(--cor)">COR</span>
      </label>
      <label class="plane-toggle pt-axi">
        <input type="checkbox" id="tog-axi" checked>
        <div class="pill"></div>
        <span style="color:var(--axi)">AXI</span>
      </label>
      <button id="rot-reset" style="background:none;border:1px solid var(--border);
        color:var(--dim);font-size:9px;padding:2px 6px;cursor:pointer;
        letter-spacing:0.1em;margin-top:2px;">RESET</button>
    </div>
  </div>
</div>

<!-- RIGHT: slice viewers B + controls -->
<div id="right">
  <div class="slice-row" id="row-sag-b">
    <div class="slice-label sag">SAG·B</div>
    <div class="slice-coord" id="coord-sag-b">—</div>
    <canvas class="slice-canvas" id="cvs-sag-b"></canvas>
  </div>
  <div class="slice-row" id="row-cor-b">
    <div class="slice-label cor">COR·B</div>
    <div class="slice-coord" id="coord-cor-b">—</div>
    <canvas class="slice-canvas" id="cvs-cor-b"></canvas>
  </div>
  <div class="slice-row" id="row-axi-b">
    <div class="slice-label axi">AXI·B</div>
    <div class="slice-coord" id="coord-axi-b">—</div>
    <canvas class="slice-canvas" id="cvs-axi-b"></canvas>
  </div>
  <!-- Slab controls -->
  <div class="ctl-strip" id="slab-strip">
    <div class="ctl-row">
      <label>SLAB</label>
      <input type="range" id="slab-slider" min="0.5" max="20" value="2" step="0.5">
      <span class="ctl-val" id="slab-val">2.0×</span>
    </div>
    <div class="ctl-row">
      <label>ENDS·B</label>
      <input type="range" id="ends-slider" min="0" max="30" value="0" step="0.5">
      <span class="ctl-val" id="ends-val">off</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { parseNifti }   from './js/nifti.js';
import { parseTck }     from './js/tck.js';
import { GridIndex }    from './js/grid-index.js';
import { VolRenderer }  from './js/vol-renderer.js';
import { voxToRas, rasToVox, eulerToMat3 } from './js/affine.js';

'use strict';
// ═══════════════════════════════════════════════════════════
// 0.  STATE
// ═══════════════════════════════════════════════════════════
const state = {
  cursor:  [0,0,0],
  cursorB: [0,0,0],
  // Per-panel view centres: in-plane components independent, out-of-plane = cursor
  viewA: {sag:[0,0,0], cor:[0,0,0], axi:[0,0,0]},
  viewB: {sag:[0,0,0], cor:[0,0,0], axi:[0,0,0]},
  nii: null,
  niiLoaded: false,
  tckLoaded: false,
};
// Out-of-plane axis index per plane
const OOP = {sag:0, cor:1, axi:2};

function syncViewOOP(views, cursor) {
  // Update each view's out-of-plane component to match cursor
  views.sag[0] = cursor[0];
  views.cor[1] = cursor[1];
  views.axi[2] = cursor[2];
}
let radius=5, probeEndsMm=0, slabMultiplier=2, endsMm=0;
let pitch=0, yaw=0, roll=0;
const vr = new VolRenderer();
window._vr = vr;  // debug access

function setCursor(ras) {
  state.cursor = ras;
  syncViewOOP(state.viewA, ras);
  updateSlices(); updateProbe(); updateCoordHud(); updatePlaneMeshes();
}
function setCursorB(ras) {
  state.cursorB = ras;
  syncViewOOP(state.viewB, ras);
  updateSlicesB(); updatePlaneMeshes();
}

// ═══════════════════════════════════════════════════════════
// 1.  SLICE RENDERING  (delegates to VolRenderer)
// ═══════════════════════════════════════════════════════════
const PLANES = {
  sag: { key:'sag', chColor:[0.23,0.97,0.8],  scrollAxis:0 },
  cor: { key:'cor', chColor:[0.97,0.63,0.23],  scrollAxis:1 },
  axi: { key:'axi', chColor:[0.63,0.23,0.97],  scrollAxis:2 },
};
const canvasA={}, canvasB={};

function drawSlice(planeKey) {
  const cvs = canvasA[planeKey];
  if (!cvs||!state.nii) return;
  vr.renderSlice(cvs, planeKey, state.viewA[planeKey], state.cursor, PLANES[planeKey].chColor, 'a');
  updateCoordLabel(planeKey, state.cursor);
}

function drawSliceB(planeKey) {
  const cvs = canvasB[planeKey];
  if (!cvs||!state.nii) return;
  vr.renderSlice(cvs, planeKey, state.viewB[planeKey], state.cursorB, PLANES[planeKey].chColor, 'b');
  // draw slab streamline overlay on top
  if (selTracts.length) drawSlabOverlay(cvs, planeKey, state.cursorB);
  updateCoordLabelB(planeKey);
}

function updateSlices()  { for (const k of ['sag','cor','axi']) drawSlice(k); }
function updateSlicesB() { for (const k of ['sag','cor','axi']) drawSliceB(k); }

function updateCoordLabel(planeKey, cursor) {
  if (!state.nii) return;
  const vox = rasToVox(state.nii.inv, ...cursor).map(Math.round);
  const ids  = {sag:'coord-sag', cor:'coord-cor', axi:'coord-axi'};
  const axes = {sag:'x', cor:'y', axi:'z'};
  const idx  = {sag:0,   cor:1,   axi:2};
  document.getElementById(ids[planeKey]).textContent = axes[planeKey]+'='+vox[idx[planeKey]];
}

function updateCoordLabelB(planeKey) {
  if (!state.nii) return;
  const vox = rasToVox(state.nii.inv, ...state.cursorB).map(Math.round);
  const ids  = {sag:'coord-sag-b', cor:'coord-cor-b', axi:'coord-axi-b'};
  const axes = {sag:'x', cor:'y', axi:'z'};
  const idx  = {sag:0,   cor:1,   axi:2};
  document.getElementById(ids[planeKey]).textContent = axes[planeKey]+'='+vox[idx[planeKey]];
}

// ═══════════════════════════════════════════════════════════
// 2.  SLAB OVERLAY  (Canvas2D on top of WebGL slice)
// ═══════════════════════════════════════════════════════════
let selTracts = [];

function getSlabHalfVox(planeKey) {
  if (!state.nii) return 1;
  const n=state.nii;
  if (planeKey==='sag') return slabMultiplier/2;
  if (planeKey==='cor') return slabMultiplier/2;
  return slabMultiplier/2;
}

function drawSlabOverlay(canvas2d, planeKey, cursor) {
  const nii = state.nii;
  const ctx = canvas2d.getContext('2d');

  // ── Slab normal in RAS mm space ─────────────────────────
  // The slice normal rotates with pitch/yaw/roll.
  // Unrotated normals: sag=[1,0,0], cor=[0,1,0], axi=[0,0,1]
  const R = vr._rot;
  const N0 = planeKey==='sag' ? [1,0,0] : planeKey==='cor' ? [0,1,0] : [0,0,1];
  // Rotate normal: N = R * N0
  const N = [
    R[0][0]*N0[0]+R[0][1]*N0[1]+R[0][2]*N0[2],
    R[1][0]*N0[0]+R[1][1]*N0[1]+R[1][2]*N0[2],
    R[2][0]*N0[0]+R[2][1]*N0[1]+R[2][2]*N0[2],
  ];
  // Normalise N
  const Nlen = Math.sqrt(N[0]**2+N[1]**2+N[2]**2)||1;
  const Nhat = [N[0]/Nlen, N[1]/Nlen, N[2]/Nlen];

  // Signed distance from slice plane (dot product with normal, plane passes through cursor)
  function signedDist(rx,ry,rz) {
    return (rx-cursor[0])*Nhat[0] + (ry-cursor[1])*Nhat[1] + (rz-cursor[2])*Nhat[2];
  }

  // Slab half-thickness in mm
  const oop = OOP[planeKey];
  const halfThickMm = slabMultiplier * nii.pixdim[oop+1] / 2;

  function rasToPixel(rx,ry,rz) {
    return vr.rasToCanvas(planeKey, rx, ry, rz, 'b') || [0,0];
  }

  ctx.save();
  ctx.lineWidth=1.2;
  for (const t of selTracts) {
    const n=t.length/3; if(n<2) continue;
    let arcLen=null;
    if (endsMm>0) {
      arcLen=new Float32Array(n);
      for(let i=1;i<n;i++){const dx=t[3*i]-t[3*i-3],dy=t[3*i+1]-t[3*i-2],dz=t[3*i+2]-t[3*i-1];arcLen[i]=arcLen[i-1]+Math.sqrt(dx*dx+dy*dy+dz*dz);}
    }
    const totalLen=arcLen?arcLen[n-1]:0;
    for (let i=0;i<n-1;i++) {
      if (endsMm>0) {
        const fs0=arcLen[i],fs1=arcLen[i+1],fe0=totalLen-arcLen[i],fe1=totalLen-arcLen[i+1];
        if(!(fs0<=endsMm||fs1<=endsMm||fe0<=endsMm||fe1<=endsMm)) continue;
      }
      const x0=t[3*i],y0=t[3*i+1],z0=t[3*i+2];
      const x1=t[3*i+3],y1=t[3*i+4],z1=t[3*i+5];
      // Depth = signed distance of segment midpoint from slice plane (mm)
      const dep = Math.abs(signedDist((x0+x1)/2,(y0+y1)/2,(z0+z1)/2));
      if(dep > halfThickMm*4) continue;
      const br = dep<=halfThickMm ? 1.0 : Math.max(0.15, 1-(dep-halfThickMm)/(halfThickMm*3));
      const ddx=Math.abs(x1-x0),ddy=Math.abs(y1-y0),ddz=Math.abs(z1-z0);
      const dl=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz)||1;
      const r=Math.round(ddx/dl*255*br),g=Math.round(ddy/dl*255*br),b=Math.round(ddz/dl*255*br);
      const [px0,py0]=rasToPixel(x0,y0,z0);
      const [px1,py1]=rasToPixel(x1,y1,z1);
      ctx.strokeStyle=`rgb(${r},${g},${b})`;
      ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px1,py1); ctx.stroke();
    }
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// 3.  SLICE INTERACTION
// ═══════════════════════════════════════════════════════════


function initSliceInteraction(planeKey, getCanvas, getCursorFn, setCursorFn, tag) {
  function cvs() { return getCanvas(); }
  let dragging=false;
  requestAnimationFrame(()=>{
    const c=cvs();
    function place(e) {
      if(!state.nii) return;
      const rect=c.getBoundingClientRect();
      const ex=(e.clientX-rect.left)*(c.width/rect.width);
      const ey=(e.clientY-rect.top)*(c.height/rect.height);
      // canvasToRas uses viewCentre of this panel as reference — view stays fixed
      const newRas=vr.canvasToRas(planeKey, ex, ey, tag);
      if(newRas) setCursorFn(newRas);
    }
    c.addEventListener('mousedown', e=>{ dragging=true; place(e); });
    c.addEventListener('mousemove', e=>{ if(dragging) place(e); });
    document.addEventListener('mouseup', ()=>dragging=false);
    c.addEventListener('wheel', e=>{
      e.preventDefault();
      if(!state.nii) return;
      const nii=state.nii;
      const dir=e.deltaY>0?1:-1;
      const vox=rasToVox(nii.inv,...getCursorFn());
      const newVox=[...vox];
      if(planeKey==='sag') newVox[0]=Math.max(0,Math.min(nii.nx-1,vox[0]+dir));
      if(planeKey==='cor') newVox[1]=Math.max(0,Math.min(nii.ny-1,vox[1]+dir));
      if(planeKey==='axi') newVox[2]=Math.max(0,Math.min(nii.nz-1,vox[2]+dir));
      setCursorFn(voxToRas(nii.affine,...newVox));
    },{passive:false});
  });
}

// ═══════════════════════════════════════════════════════════
// 4.  THREE.JS + TRACKBALL
// ═══════════════════════════════════════════════════════════
const threeCanvas=document.getElementById('three-canvas');
const renderer3=new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true});
renderer3.setPixelRatio(window.devicePixelRatio);
renderer3.setClearColor(0x080b0f);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.1,5000);
camera.position.set(0,0,200);

// TrackballControls (inlined)
const {EventDispatcher,Quaternion,Vector2,Vector3}=THREE;
class TrackballControls extends EventDispatcher{
  constructor(obj,el){
    super();const sc=this;
    const S={NONE:-1,ROTATE:0,ZOOM:1,PAN:2};
    this.object=obj;this.domElement=el;el.style.touchAction='none';
    this.enabled=true;this.screen={left:0,top:0,width:0,height:0};
    this.rotateSpeed=2;this.zoomSpeed=1.2;this.panSpeed=0.5;
    this.staticMoving=true;
    this.target=new Vector3();
    const EPS=1e-6,lp=new Vector3();
    let st=S.NONE;
    const eye=new Vector3(),mp=new Vector2(),mc=new Vector2(),
          la=new Vector3(),zs=new Vector2(),ze=new Vector2(),
          ps=new Vector2(),pe=new Vector2(),ptrs=[],ppos={};
    this.target0=this.target.clone();this.position0=obj.position.clone();this.up0=obj.up.clone();
    this.handleResize=()=>{const b=el.getBoundingClientRect(),d=el.ownerDocument.documentElement;sc.screen={left:b.left+pageXOffset-d.clientLeft,top:b.top+pageYOffset-d.clientTop,width:b.width,height:b.height};};
    const gmc=(px,py)=>{const v=new Vector2();v.set(((px-sc.screen.width*.5-sc.screen.left)/(sc.screen.width*.5)),(sc.screen.height+2*(sc.screen.top-py))/sc.screen.width);return v;};
    const gms=(px,py)=>{const v=new Vector2();v.set((px-sc.screen.left)/sc.screen.width,(py-sc.screen.top)/sc.screen.height);return v;};
    this.rotateCamera=(()=>{const ax=new Vector3(),q=new Quaternion(),ed=new Vector3(),ou=new Vector3(),os=new Vector3(),md=new Vector3();return()=>{md.set(mc.x-mp.x,mc.y-mp.y,0);let a=md.length();if(a){eye.copy(sc.object.position).sub(sc.target);ed.copy(eye).normalize();ou.copy(sc.object.up).normalize();os.crossVectors(ou,ed).normalize();ou.setLength(mc.y-mp.y);os.setLength(mc.x-mp.x);md.copy(ou.add(os));ax.crossVectors(md,eye).normalize();a*=sc.rotateSpeed;q.setFromAxisAngle(ax,a);eye.applyQuaternion(q);sc.object.up.applyQuaternion(q);}mp.copy(mc);};})();
    this.zoomCamera=()=>{const f=1+(ze.y-zs.y)*sc.zoomSpeed;if(f!==1&&f>0)eye.multiplyScalar(f);if(sc.staticMoving)zs.copy(ze);};
    this.panCamera=(()=>{const ch=new Vector2(),ou=new Vector3(),p=new Vector3();return()=>{ch.copy(pe).sub(ps);if(ch.lengthSq()){ch.multiplyScalar(eye.length()*sc.panSpeed);p.copy(eye).cross(sc.object.up).setLength(ch.x);p.add(ou.copy(sc.object.up).setLength(ch.y));sc.object.position.add(p);sc.target.add(p);if(sc.staticMoving)ps.copy(pe);};};})();
    this.update=()=>{eye.subVectors(sc.object.position,sc.target);sc.rotateCamera();sc.zoomCamera();sc.panCamera();sc.object.position.addVectors(sc.target,eye);sc.object.lookAt(sc.target);if(lp.distanceToSquared(sc.object.position)>EPS)lp.copy(sc.object.position);renderer3.render(scene,camera);};
    const omd=e=>{if(st===S.NONE){if(e.button===0)st=S.ROTATE;else if(e.button===1)st=S.ZOOM;else if(e.button===2)st=S.PAN;}if(st===S.ROTATE){mc.copy(gmc(e.pageX,e.pageY));mp.copy(mc);}else if(st===S.ZOOM){zs.copy(gms(e.pageX,e.pageY));ze.copy(zs);}else if(st===S.PAN){ps.copy(gms(e.pageX,e.pageY));pe.copy(ps);}sc.update();};
    const omm=e=>{if(st===S.ROTATE){mp.copy(mc);mc.copy(gmc(e.pageX,e.pageY));}else if(st===S.ZOOM)ze.copy(gms(e.pageX,e.pageY));else if(st===S.PAN)pe.copy(gms(e.pageX,e.pageY));sc.update();};
    const omu=()=>{st=S.NONE;sc.update();};
    const omw=e=>{if(!sc.enabled)return;e.preventDefault();if(e.deltaMode===2)zs.y-=e.deltaY*.025;else if(e.deltaMode===1)zs.y-=e.deltaY*.01;else zs.y-=e.deltaY*.00025;sc.update();};
    const opd=e=>{if(!sc.enabled)return;if(ptrs.length===0){el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',opm);el.addEventListener('pointerup',opu);}ptrs.push(e);if(e.pointerType==='touch'){}else omd(e);};
    const opm=e=>{if(!sc.enabled)return;if(e.pointerType!=='touch')omm(e);};
    const opu=e=>{if(!sc.enabled)return;omu();ptrs.splice(ptrs.findIndex(p=>p.pointerId===e.pointerId),1);if(ptrs.length===0){el.releasePointerCapture(e.pointerId);el.removeEventListener('pointermove',opm);el.removeEventListener('pointerup',opu);}};
    el.addEventListener('contextmenu',e=>{if(sc.enabled)e.preventDefault();});
    el.addEventListener('pointerdown',opd);
    el.addEventListener('wheel',omw,{passive:false});
    this.handleResize();this.update();
  }
}

// ═══════════════════════════════════════════════════════════
// 5.  TRACTOGRAM 3D
// ═══════════════════════════════════════════════════════════
let bgMesh=null,selMesh=null,probeSphere=null;
// Slice plane meshes in 3D view
const planeMeshes = {sag:null, cor:null, axi:null};
const planeVisible = {sag:true, cor:true, axi:true};
const PLANE_COLORS = {sag:0x3af8cc, cor:0xf8a03a, axi:0xa03af8};

function makePlaneMesh(planeKey) {
  // Build a quad in RAS space representing the current slice plane
  // Uses the same viewCentre and rotation as the renderer
  if (!state.nii) return null;
  const nii = state.nii;
  const R = vr._rot;
  const vc = state.viewB[planeKey] || state.cursorB;

  // Plane axes (same logic as vol-renderer)
  let U0, V0;
  if      (planeKey==='sag') { U0=[0,1,0]; V0=[0,0,1]; }
  else if (planeKey==='cor') { U0=[1,0,0]; V0=[0,0,1]; }
  else                       { U0=[1,0,0]; V0=[0,1,0]; }
  const U = [R[0][0]*U0[0]+R[0][1]*U0[1]+R[0][2]*U0[2], R[1][0]*U0[0]+R[1][1]*U0[1]+R[1][2]*U0[2], R[2][0]*U0[0]+R[2][1]*U0[1]+R[2][2]*U0[2]];
  const V = [R[0][0]*V0[0]+R[0][1]*V0[1]+R[0][2]*V0[2], R[1][0]*V0[0]+R[1][1]*V0[1]+R[1][2]*V0[2], R[2][0]*V0[0]+R[2][1]*V0[1]+R[2][2]*V0[2]];
  const norm = v=>{const l=Math.sqrt(v[0]**2+v[1]**2+v[2]**2)||1;return[v[0]/l,v[1]/l,v[2]/l];};
  const Uh=norm(U), Vh=norm(V);

  // Physical half-extents
  const sp=[nii.pixdim[1],nii.pixdim[2],nii.pixdim[3]];
  let hU,hV;
  if      (planeKey==='sag'){hU=nii.ny*sp[1]/2; hV=nii.nz*sp[2]/2;}
  else if (planeKey==='cor'){hU=nii.nx*sp[0]/2; hV=nii.nz*sp[2]/2;}
  else                      {hU=nii.nx*sp[0]/2; hV=nii.ny*sp[1]/2;}

  const cx=vc[0],cy=vc[1],cz=vc[2];
  // Four corners
  const verts = new Float32Array([
    cx-Uh[0]*hU-Vh[0]*hV, cy-Uh[1]*hU-Vh[1]*hV, cz-Uh[2]*hU-Vh[2]*hV,
    cx+Uh[0]*hU-Vh[0]*hV, cy+Uh[1]*hU-Vh[1]*hV, cz+Uh[2]*hU-Vh[2]*hV,
    cx-Uh[0]*hU+Vh[0]*hV, cy-Uh[1]*hU+Vh[1]*hV, cz-Uh[2]*hU+Vh[2]*hV,
    cx+Uh[0]*hU+Vh[0]*hV, cy+Uh[1]*hU+Vh[1]*hV, cz+Uh[2]*hU+Vh[2]*hV,
  ]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(verts,3));
  geo.setIndex([0,1,2, 1,3,2]);
  const col = PLANE_COLORS[planeKey];
  // Fill: transparent, 10% opacity
  const fillMat = new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0.08, side:THREE.DoubleSide, depthWrite:false});
  const fill = new THREE.Mesh(geo.clone(), fillMat);
  // Border: line loop around the quad
  const borderPts = new Float32Array([
    verts[0],verts[1],verts[2],
    verts[3],verts[4],verts[5],
    verts[9],verts[10],verts[11],
    verts[6],verts[7],verts[8],
    verts[0],verts[1],verts[2],
  ]);
  const borderGeo = new THREE.BufferGeometry();
  borderGeo.setAttribute('position', new THREE.BufferAttribute(borderPts,3));
  const borderMat = new THREE.LineBasicMaterial({color:col, linewidth:1, transparent:true, opacity:0.7});
  const border = new THREE.Line(borderGeo, borderMat);
  const group = new THREE.Group();
  group.add(fill); group.add(border);
  return group;
}

function updatePlaneMeshes() {
  for (const k of ['sag','cor','axi']) {
    if (planeMeshes[k]) { scene.remove(planeMeshes[k]); planeMeshes[k]=null; }
    if (planeVisible[k] && state.nii) {
      planeMeshes[k] = makePlaneMesh(k);
      if (planeMeshes[k]) scene.add(planeMeshes[k]);
    }
  }
  renderer3.render(scene,camera);
}
let gridIdx=null,tractForPoint=null,allPts=null,allTracts=null;

function makeEndpointCloud(tracts){
  const pos=new Float32Array(tracts.length*6);let vi=0;
  for(const t of tracts){const n=t.length/3;pos[vi++]=t[0];pos[vi++]=t[1];pos[vi++]=t[2];pos[vi++]=t[3*(n-1)];pos[vi++]=t[3*(n-1)+1];pos[vi++]=t[3*(n-1)+2];}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({size:0.2,color:0x556677,sizeAttenuation:true}));
}

function makeLineSegments(tracts){
  let tv=0;for(const t of tracts){const n=t.length/3;if(n>=2)tv+=2*(n-1);}
  const pos=new Float32Array(tv*3),col=new Float32Array(tv*3);let vi=0;
  for(const t of tracts){const n=t.length/3;if(n<2)continue;
    for(let i=0;i<n-1;i++){
      const x0=t[3*i],y0=t[3*i+1],z0=t[3*i+2],x1=t[3*i+3],y1=t[3*i+4],z1=t[3*i+5];
      const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),dz=Math.abs(z1-z0),dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      pos[3*vi]=x0;pos[3*vi+1]=y0;pos[3*vi+2]=z0;pos[3*vi+3]=x1;pos[3*vi+4]=y1;pos[3*vi+5]=z1;
      col[3*vi]=col[3*vi+3]=dx/dl;col[3*vi+1]=col[3*vi+4]=dy/dl;col[3*vi+2]=col[3*vi+5]=dz/dl;
      vi+=2;}}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  return new THREE.LineSegments(geo,new THREE.LineBasicMaterial({vertexColors:true}));
}

function updateProbe(){
  if(!gridIdx) return;
  const [cx,cy,cz]=state.cursor;
  if(probeSphere) scene.remove(probeSphere);
  const sg=new THREE.SphereGeometry(radius*0.25,12,8);
  probeSphere=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0xffdd44,wireframe:true}));
  probeSphere.position.set(cx,cy,cz); scene.add(probeSphere);
  if(selMesh){scene.remove(selMesh);selMesh.geometry.dispose();selMesh=null;}
  let ids;
  if(probeEndsMm<=0){
    const hitPts=gridIdx.queryRadius(cx,cy,cz,radius);
    const hitSet=new Set();for(const pi of hitPts)hitSet.add(tractForPoint[pi]);
    ids=Array.from(hitSet);
  } else {
    const r2=radius*radius,hitSet=new Set();
    for(let si=0;si<allTracts.length;si++){
      const t=allTracts[si],n=t.length/3;if(n<1)continue;
      let arc=0;
      for(let i=0;i<n;i++){
        if(i>0){const dx=t[3*i]-t[3*i-3],dy=t[3*i+1]-t[3*i-2],dz=t[3*i+2]-t[3*i-1];arc+=Math.sqrt(dx*dx+dy*dy+dz*dz);}
        if(arc>probeEndsMm)break;
        const dx=t[3*i]-cx,dy=t[3*i+1]-cy,dz=t[3*i+2]-cz;
        if(dx*dx+dy*dy+dz*dz<=r2){hitSet.add(si);break;}
      }
      if(hitSet.has(si))continue;
      arc=0;
      for(let i=n-1;i>=0;i--){
        if(i<n-1){const dx=t[3*i]-t[3*i+3],dy=t[3*i+1]-t[3*i+4],dz=t[3*i+2]-t[3*i+5];arc+=Math.sqrt(dx*dx+dy*dy+dz*dz);}
        if(arc>probeEndsMm)break;
        const dx=t[3*i]-cx,dy=t[3*i+1]-cy,dz=t[3*i+2]-cz;
        if(dx*dx+dy*dy+dz*dz<=r2){hitSet.add(si);break;}
      }
    }
    ids=Array.from(hitSet);
  }
  selTracts=ids.map(i=>allTracts[i]);
  document.getElementById('stat-sel').textContent=ids.length?ids.length.toLocaleString()+' selected':'';
  if(ids.length){selMesh=makeLineSegments(selTracts);scene.add(selMesh);}
  renderer3.render(scene,camera);
  updateSlicesB();
}

function updateCoordHud(){
  const [x,y,z]=state.cursor;
  document.getElementById('hud-x').textContent=x.toFixed(1);
  document.getElementById('hud-y').textContent=y.toFixed(1);
  document.getElementById('hud-z').textContent=z.toFixed(1);
}

// ═══════════════════════════════════════════════════════════
// 6.  LOAD HANDLERS
// ═══════════════════════════════════════════════════════════
function setProgress(msg){document.getElementById('mprogress').textContent=msg;}
function tick(){return new Promise(r=>setTimeout(r,20));}

async function loadNii(file){
  setProgress('reading '+file.name+'…'); await tick();
  let nii;
  try{ nii=await parseNifti(await file.arrayBuffer()); }
  catch(e){alert('NIfTI error: '+e);setProgress('');return;}
  state.nii=nii;
  state.cursor  = voxToRas(nii.affine, nii.nx/2, nii.ny/2, nii.nz/2);
  state.cursorB = [...state.cursor];
  for(const k of ['sag','cor','axi']){ state.viewA[k]=[...state.cursor]; state.viewB[k]=[...state.cursor]; }
  setProgress('uploading 3D texture…'); await tick();
  vr.upload(nii);
  state.niiLoaded=true;
  checkShowHud();
  resizeAll();
  updateSlices(); updateSlicesB(); updatePlaneMeshes();
}

async function loadTck(buf){
  setProgress('parsing .tck…'); await tick();
  let parsed;
  try{parsed=parseTck(buf);}catch(e){alert('TCK error: '+e);setProgress('');return;}
  allTracts=parsed.tracts; tractForPoint=parsed.tractForPoint;
  const np=tractForPoint.length;
  setProgress(allTracts.length.toLocaleString()+' streamlines · building index…'); await tick();
  allPts=new Float32Array(np*3); let off=0;
  for(const t of allTracts){for(let i=0;i<t.length;i++)allPts[off+i]=+t[i];off+=t.length;}
  gridIdx=new GridIndex(allPts,radius);
  setProgress('uploading geometry…'); await tick();
  if(bgMesh){scene.remove(bgMesh);bgMesh.geometry.dispose();}
  bgMesh=makeEndpointCloud(allTracts); scene.add(bgMesh);
  let cx=0,cy=0,cz=0;
  for(let i=0;i<allPts.length;i+=3){cx+=allPts[i];cy+=allPts[i+1];cz+=allPts[i+2];}
  cx/=np;cy/=np;cz/=np;
  let md=0;for(let i=0;i<allPts.length;i+=3){const dx=allPts[i]-cx,dy=allPts[i+1]-cy,dz=allPts[i+2]-cz;md=Math.max(md,dx*dx+dy*dy+dz*dz);}
  const br=Math.sqrt(md);
  controls.target.set(cx,cy,cz);
  camera.position.set(cx,cy,cz+br*2.5);
  camera.near=br*.001;camera.far=br*20;camera.updateProjectionMatrix();
  document.getElementById('stat-total').textContent=allTracts.length.toLocaleString()+' streamlines';
  state.tckLoaded=true; setProgress(''); checkShowHud(); controls.update();
}

function checkShowHud(){
  if(state.niiLoaded){document.getElementById('dz-nii').style.display='none';}
  if(state.tckLoaded){document.getElementById('dz-tck').style.display='none';}
  if(state.niiLoaded&&state.tckLoaded){document.getElementById('load-overlay').remove();}
  document.getElementById('middle-hud').style.display='block';
}

// 7.  RESIZE
// ═══════════════════════════════════════════════════════════
function resizeAll(){
  for(const k of ['sag','cor','axi']){
    for(const c of [canvasA[k],canvasB[k]]){
      if(!c)continue;
      // only resize if dimensions actually changed (avoids clearing on no-op)
      if(c.width!==c.clientWidth||c.height!==c.clientHeight){
        c.width =c.clientWidth;
        c.height=c.clientHeight;
        if(vr._dbg) delete vr._dbg[Object.keys(PLANES).find(k2=>canvasA[k2]===c||canvasB[k2]===c)];
      }
    }
  }
  const mc=document.getElementById('middle');
  renderer3.setSize(mc.clientWidth,mc.clientHeight,false);
  camera.aspect=mc.clientWidth/mc.clientHeight;
  camera.updateProjectionMatrix();
  controls.handleResize();
  renderer3.render(scene,camera);
  if(state.nii){ updateSlices(); updateSlicesB(); }
}
new ResizeObserver(resizeAll).observe(document.body);

function updateRotation(){
  const p=pitch*Math.PI/180, y=yaw*Math.PI/180, r=roll*Math.PI/180;
  vr.setRotation(p,y,r);
  updateSlices(); updateSlicesB(); updatePlaneMeshes();
}

// 9.  FILE DROP / PICK
// ═══════════════════════════════════════════════════════════
function setupDrop(dzId,inputId,handler){
  const dz=document.getElementById(dzId);
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])handler(e.dataTransfer.files[0]);});
  document.getElementById(inputId).addEventListener('change',e=>{if(e.target.files[0])handler(e.target.files[0]);});
}
setupDrop('dz-nii','fi-nii',f=>loadNii(f));
setupDrop('dz-tck','fi-tck',f=>{const r=new FileReader();r.onload=e=>loadTck(e.target.result);r.readAsArrayBuffer(f);});
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',e=>{
  e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='tck'){const r=new FileReader();r.onload=ev=>loadTck(ev.target.result);r.readAsArrayBuffer(f);}
  else loadNii(f);
});
