<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Viewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080b0f;--panel:#0c1018;--border:#1a2030;
  --accent:#4af;--accent2:#f84;--dim:#2a3545;
  --text:#8899aa;--bright:#ccdde8;
  --sag:#3af8cc;--cor:#f8a03a;--axi:#a03af8;
}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;
  display:flex;height:100vh;overflow:hidden;font-size:11px;}

/* ── LEFT PANEL (1/4) ── */
#left{width:33.333%;display:flex;flex-direction:column;border-right:1px solid var(--border);
  background:var(--panel);flex-shrink:0;}
#left .slice-row{flex:1;min-height:0;}
.slice-row{flex:1;display:flex;flex-direction:column;position:relative;
  border-bottom:1px solid var(--border);}
.slice-row:last-child{border-bottom:none;}
.slice-label{position:absolute;top:6px;left:8px;z-index:2;letter-spacing:0.15em;
  font-size:10px;font-weight:500;pointer-events:none;}
.slice-label.sag{color:var(--sag);}
.slice-label.cor{color:var(--cor);}
.slice-label.axi{color:var(--axi);}
.slice-coord{position:absolute;top:6px;right:8px;z-index:2;color:var(--dim);
  font-size:10px;pointer-events:none;}
.slice-canvas{width:100%;height:100%;display:block;cursor:crosshair;}

/* ── MIDDLE PANEL (1/2) ── */
#middle{flex:1;position:relative;}
#three-canvas{width:100%;height:100%;display:block;}

/* ── RIGHT PANEL (1/4) ── */
#right{width:33.333%;display:flex;flex-direction:column;border-left:1px solid var(--border);
  background:var(--panel);flex-shrink:0;}
#right .slice-row{flex:1;min-height:0;}
#right .slice-label{font-size:9px;}
#right .slice-coord{font-size:9px;}
#slab-ctl,#probe-ctl{display:flex;flex-direction:column;gap:4px;padding:6px 8px;
  background:rgba(8,11,15,0.85);border-top:1px solid var(--border);
  pointer-events:all;flex-shrink:0;}
.slab-row{display:flex;align-items:center;gap:6px;}
#slab-ctl label,#probe-ctl label{color:var(--dim);letter-spacing:0.1em;font-size:9px;
  white-space:nowrap;min-width:38px;}
#slab-ctl input,#probe-ctl input{flex:1;accent-color:var(--accent2);min-width:0;}
#slab-val,#ends-val,#probe-radius-val,#probe-ends-val{color:var(--text);font-size:9px;min-width:34px;text-align:right;}

/* ── HUD overlays ── */
#load-overlay{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:20px;z-index:10;
  background:rgba(8,11,15,0.92);}
#load-overlay h2{color:var(--bright);letter-spacing:0.3em;font-size:12px;font-weight:400;}
.drop-zone{border:1px solid var(--border);padding:2rem 2.5rem;text-align:center;
  cursor:pointer;transition:border-color 0.2s;min-width:200px;}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);}
.drop-zone p{color:var(--dim);font-size:10px;margin-top:6px;letter-spacing:0.1em;}
.drop-zone .tag{color:var(--accent);font-size:10px;margin-bottom:4px;}
input[type=file]{display:none;}

#right-hud{position:absolute;inset:0;pointer-events:none;}

#stats{position:absolute;top:16px;right:16px;text-align:right;
  line-height:2;color:var(--dim);}
#coord-hud{position:absolute;bottom:20px;right:16px;text-align:right;
  line-height:1.8;color:var(--dim);}
#coord-hud span{color:var(--text);}
#progress{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--dim);letter-spacing:0.2em;text-align:center;line-height:2;}
#info{position:absolute;top:16px;left:16px;line-height:2;color:var(--border);}
#info span{color:var(--dim);}
</style>
</head>
<body>

<!-- LEFT: slice viewers (cursor A → probe) -->
<div id="left">
  <div class="slice-row" id="row-sag">
    <div class="slice-label sag">SAG·A</div>
    <div class="slice-coord" id="coord-sag">—</div>
    <canvas class="slice-canvas" id="cvs-sag"></canvas>
  </div>
  <div class="slice-row" id="row-cor">
    <div class="slice-label cor">COR·A</div>
    <div class="slice-coord" id="coord-cor">—</div>
    <canvas class="slice-canvas" id="cvs-cor"></canvas>
  </div>
  <div class="slice-row" id="row-axi">
    <div class="slice-label axi">AXI·A</div>
    <div class="slice-coord" id="coord-axi">—</div>
    <canvas class="slice-canvas" id="cvs-axi"></canvas>
  </div>
  <div id="probe-ctl">
    <div class="slab-row">
      <label>RADIUS</label>
      <input type="range" id="radius-slider" min="1" max="30" value="5" step="0.5">
      <span id="radius-val">5.0 mm</span>
    </div>
    <div class="slab-row">
      <label>ENDS</label>
      <input type="range" id="probe-ends-slider" min="0" max="30" value="0" step="0.5">
      <span id="probe-ends-val">off</span>
    </div>
  </div>
</div>

<!-- MIDDLE: 3D view -->
<div id="middle">
  <canvas id="three-canvas"></canvas>

  <!-- load overlay -->
  <div id="load-overlay">
    <h2>BRAIN VIEWER</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
      <div class="drop-zone" id="dz-nii" onclick="document.getElementById('fi-nii').click()">
        <div class="tag">ANATOMY</div>
        <div style="color:var(--bright);margin:4px 0;">.nii / .nii.gz</div>
        <p>drop or click</p>
        <input type="file" id="fi-nii" accept=".nii,.gz">
      </div>
      <div class="drop-zone" id="dz-tck" onclick="document.getElementById('fi-tck').click()">
        <div class="tag">TRACTOGRAM</div>
        <div style="color:var(--bright);margin:4px 0;">.tck</div>
        <p>drop or click</p>
        <input type="file" id="fi-tck" accept=".tck">
      </div>
    </div>
    <div id="progress"></div>
  </div>

  <div id="middle-hud" style="display:none;">
    <div id="info">
      <div><span>LEFT DRAG</span> rotate &nbsp; <span>RIGHT DRAG</span> pan &nbsp; <span>SCROLL</span> zoom</div>
      <div><span>CLICK SLICES</span> move probe &nbsp; <span>SCROLL SLICES</span> change slice</div>
    </div>
    <div id="stats">
      <div id="stat-total"></div>
      <div id="stat-sel"></div>
    </div>

    <div id="coord-hud">
      <div>X <span id="hud-x">—</span> &nbsp; Y <span id="hud-y">—</span> &nbsp; Z <span id="hud-z">—</span> mm</div>
    </div>
  </div>
</div>

<!-- RIGHT: slice viewers (cursor B → slab overlay) -->
<div id="right">
  <div class="slice-row" id="row-sag-b" style="position:relative;">
    <div class="slice-label sag">SAG·B</div>
    <div class="slice-coord" id="coord-sag-b">—</div>
    <canvas class="slice-canvas" id="cvs-sag-b"></canvas>
  </div>
  <div class="slice-row" id="row-cor-b" style="position:relative;">
    <div class="slice-label cor">COR·B</div>
    <div class="slice-coord" id="coord-cor-b">—</div>
    <canvas class="slice-canvas" id="cvs-cor-b"></canvas>
  </div>
  <div class="slice-row" id="row-axi-b" style="position:relative;">
    <div class="slice-label axi">AXI·B</div>
    <div class="slice-coord" id="coord-axi-b">—</div>
    <canvas class="slice-canvas" id="cvs-axi-b"></canvas>
  </div>
  <div id="slab-ctl">
    <div class="slab-row">
      <label>SLAB</label>
      <input type="range" id="slab-slider" min="0.5" max="20" value="2" step="0.5">
      <span id="slab-val">2.0×</span>
    </div>
    <div class="slab-row">
      <label>ENDS</label>
      <input type="range" id="ends-slider" min="0" max="30" value="0" step="0.5">
      <span id="ends-val">off</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// 0.  SHARED STATE
// ═══════════════════════════════════════════════════════════
const state = {
  cursor:  [0,0,0],   // RAS mm — cursor A (probe)
  cursorB: [0,0,0],   // RAS mm — cursor B (slab viewer)
  nii: null,
  tckLoaded: false,
  niiLoaded: false,
};
function setCursor(ras, source) {
  state.cursor = ras;
  updateSlices(source);
  updateProbe();
  updateCoordHud();
}
function setCursorB(ras, source) {
  state.cursorB = ras;
  updateSlicesB(source);
  updateCoordLabelsB();
}

// ═══════════════════════════════════════════════════════════
// 1.  NIFTI PARSER  (self-contained: sform + qform quaternion)
// ═══════════════════════════════════════════════════════════
async function parseNifti(buf) {
  // decompress gzip
  const magic = new Uint8Array(buf, 0, 2);
  if (magic[0]===0x1f && magic[1]===0x8b) {
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    writer.write(new Uint8Array(buf)); writer.close();
    const chunks=[], reader=ds.readable.getReader();
    while(true){ const {done,value}=await reader.read(); if(done) break; chunks.push(value); }
    const total=chunks.reduce((a,c)=>a+c.length,0);
    const out=new Uint8Array(total); let off=0;
    for(const c of chunks){ out.set(c,off); off+=c.length; }
    buf=out.buffer;
  }

  const dv = new DataView(buf);
  const sizeof_hdr = dv.getInt32(0,true);
  const le = (sizeof_hdr===348);
  const dims    = Array.from({length:8},(_,i)=>dv.getInt16(40+i*2,le));
  const nx=dims[1], ny=dims[2], nz=dims[3];
  const datatype  = dv.getInt16(70,le);
  const vox_offset= dv.getFloat32(108,le);
  const pixdim    = Array.from({length:8},(_,i)=>dv.getFloat32(76+i*4,le));
  const qform_code= dv.getInt16(252,le);
  const sform_code= dv.getInt16(254,le);

  let affine;
  if (sform_code > 0) {
    // sform rows at byte offsets 280, 296, 312
    affine = [
      [dv.getFloat32(280,le),dv.getFloat32(284,le),dv.getFloat32(288,le),dv.getFloat32(292,le)],
      [dv.getFloat32(296,le),dv.getFloat32(300,le),dv.getFloat32(304,le),dv.getFloat32(308,le)],
      [dv.getFloat32(312,le),dv.getFloat32(316,le),dv.getFloat32(320,le),dv.getFloat32(324,le)],
      [0,0,0,1]
    ];
  } else if (qform_code > 0) {
    // qform quaternion params at byte offsets 256(b),260(c),264(d), 268(qx),272(qy),276(qz)
    const b=dv.getFloat32(256,le), c=dv.getFloat32(260,le), d=dv.getFloat32(264,le);
    const a=Math.sqrt(Math.max(0,1-b*b-c*c-d*d));
    const qx=dv.getFloat32(268,le), qy=dv.getFloat32(272,le), qz=dv.getFloat32(276,le);
    const qfac=pixdim[0]<0?-1:1;
    const dx=pixdim[1], dy=pixdim[2], dz=pixdim[3];
    // NIfTI qform to affine (eq. 3 from NIfTI-1 spec)
    affine = [
      [ dx*(a*a+b*b-c*c-d*d), dx*2*(b*c-a*d),         dx*2*(b*d+a*c),         qx ],
      [ dy*2*(b*c+a*d),        dy*(a*a+c*c-b*b-d*d),   dy*2*(c*d-a*b),         qy ],
      [ qfac*dz*2*(b*d-a*c),   qfac*dz*2*(c*d+a*b),    qfac*dz*(a*a+d*d-c*c-b*b), qz ],
      [0,0,0,1]
    ];
  } else {
    affine = [
      [pixdim[1],0,0,0],[0,pixdim[2],0,0],[0,0,pixdim[3],0],[0,0,0,1]
    ];
  }

  const inv = invertAffine4x4(affine);

  const start = Math.round(vox_offset);
  const n = nx*ny*nz;
  let data;
  if      (datatype===2)   data = new Uint8Array(buf,start,n);
  else if (datatype===4)   data = new Int16Array(buf.slice(start),0,n);
  else if (datatype===8)   data = new Int32Array(buf.slice(start),0,n);
  else if (datatype===16)  data = new Float32Array(buf.slice(start),0,n);
  else if (datatype===64)  { const f=new Float64Array(buf.slice(start),0,n); data=new Float32Array(n); for(let i=0;i<n;i++) data[i]=f[i]; }
  else if (datatype===256) data = new Int8Array(buf,start,n);
  else if (datatype===512) data = new Uint16Array(buf.slice(start),0,n);
  else throw 'Unsupported datatype '+datatype;

  let mn=Infinity, mx=-Infinity;
  for(let i=0;i<data.length;i+=7){ if(data[i]<mn)mn=data[i]; if(data[i]>mx)mx=data[i]; }

  console.log('NIfTI sform='+sform_code+' qform='+qform_code+' affine:', JSON.stringify(affine));
  return { nx, ny, nz, pixdim, affine, inv, data, mn, mx };
}

function invertAffine4x4(m) {
  // NIfTI affine is a 3x3 matrix R plus translation t.
  // Inverse: R_inv = inverse of 3x3, t_inv = -R_inv * t
  // This is numerically stable and exact for affine transforms.
  const a00=m[0][0],a01=m[0][1],a02=m[0][2],tx=m[0][3];
  const a10=m[1][0],a11=m[1][1],a12=m[1][2],ty=m[1][3];
  const a20=m[2][0],a21=m[2][1],a22=m[2][2],tz=m[2][3];

  // 3x3 cofactors
  const c00= a11*a22-a12*a21;
  const c01=-(a10*a22-a12*a20);
  const c02= a10*a21-a11*a20;
  const c10=-(a01*a22-a02*a21);
  const c11= a00*a22-a02*a20;
  const c12=-(a00*a21-a01*a20);
  const c20= a01*a12-a02*a11;
  const c21=-(a00*a12-a02*a10);
  const c22= a00*a11-a01*a10;

  const det = a00*c00 + a01*c01 + a02*c02;
  const i00=c00/det, i01=c10/det, i02=c20/det;
  const i10=c01/det, i11=c11/det, i12=c21/det;
  const i20=c02/det, i21=c12/det, i22=c22/det;

  // translation: -R_inv * t
  const itx = -(i00*tx + i01*ty + i02*tz);
  const ity = -(i10*tx + i11*ty + i12*tz);
  const itz = -(i20*tx + i21*ty + i22*tz);

  return [
    [i00, i01, i02, itx],
    [i10, i11, i12, ity],
    [i20, i21, i22, itz],
    [0,   0,   0,   1  ]
  ];
}

function rasToVox(nii, rx,ry,rz) {
  const m=nii.inv;
  return [
    m[0][0]*rx+m[0][1]*ry+m[0][2]*rz+m[0][3],
    m[1][0]*rx+m[1][1]*ry+m[1][2]*rz+m[1][3],
    m[2][0]*rx+m[2][1]*ry+m[2][2]*rz+m[2][3],
  ];
}
function voxToRas(nii, vx,vy,vz) {
  const m=nii.affine;
  return [
    m[0][0]*vx+m[0][1]*vy+m[0][2]*vz+m[0][3],
    m[1][0]*vx+m[1][1]*vy+m[1][2]*vz+m[1][3],
    m[2][0]*vx+m[2][1]*vy+m[2][2]*vz+m[2][3],
  ];
}
function getVoxel(nii,xi,yi,zi){
  xi=Math.round(xi); yi=Math.round(yi); zi=Math.round(zi);
  if(xi<0||xi>=nii.nx||yi<0||yi>=nii.ny||zi<0||zi>=nii.nz) return 0;
  return nii.data[xi + yi*nii.nx + zi*nii.nx*nii.ny];
}

// ═══════════════════════════════════════════════════════════
// 2.  SLICE RENDERING
// ═══════════════════════════════════════════════════════════
// Each plane extracts a 2D slice and draws it with crosshairs
const planes = {
  sag: { canvas: null, ctx: null, label:'SAG', color:'#3af8cc', _lb:null,
    // sagittal: cols=Y, rows=Z, fixed X
    getSlice(nii, vox) {
      const xi=Math.round(vox[0]);
      const W=nii.ny, H=nii.nz;
      const px=new Uint8ClampedArray(W*H*4);
      const sc=255/(nii.mx-nii.mn)||1;
      for(let z=0;z<H;z++) for(let y=0;y<W;y++){
        const v=Math.max(0,Math.min(255,(getVoxel(nii,xi,y,H-1-z)-nii.mn)*sc));
        const i=(z*W+y)*4; px[i]=v;px[i+1]=v;px[i+2]=v;px[i+3]=255;
      }
      return {imageData:new ImageData(px,W,H),
        cx:(vox[1]+0.5)/nii.ny, cy:1-(vox[2]+0.5)/nii.nz,
        physW:nii.ny*nii.pixdim[2], physH:nii.nz*nii.pixdim[3]};
    },
    clickToRas(nii,fx,fy,vox){
      const y=fx*nii.ny-0.5, z=(1-fy)*nii.nz-0.5;
      return voxToRas(nii,vox[0],y,z);
    },
    clickToRasLB(nii,ex,ey,vox){
      if(!this._lb) return null;
      const {dx,dy,dw,dh}=this._lb;
      const fx=(ex-dx)/dw, fy=(ey-dy)/dh;
      if(fx<0||fx>1||fy<0||fy>1) return null;
      return this.clickToRas(nii,fx,fy,vox);
    }
  },
  cor: { canvas:null, ctx:null, label:'COR', color:'#f8a03a', _lb:null,
    // coronal: cols=X, rows=Z, fixed Y
    getSlice(nii, vox) {
      const yi=Math.round(vox[1]);
      const W=nii.nx, H=nii.nz;
      const px=new Uint8ClampedArray(W*H*4);
      const sc=255/(nii.mx-nii.mn)||1;
      for(let z=0;z<H;z++) for(let x=0;x<W;x++){
        const v=Math.max(0,Math.min(255,(getVoxel(nii,x,yi,H-1-z)-nii.mn)*sc));
        const i=(z*W+x)*4; px[i]=v;px[i+1]=v;px[i+2]=v;px[i+3]=255;
      }
      return {imageData:new ImageData(px,W,H),
        cx:(vox[0]+0.5)/nii.nx, cy:1-(vox[2]+0.5)/nii.nz,
        physW:nii.nx*nii.pixdim[1], physH:nii.nz*nii.pixdim[3]};
    },
    clickToRas(nii,fx,fy,vox){
      const x=fx*nii.nx-0.5, z=(1-fy)*nii.nz-0.5;
      return voxToRas(nii,x,vox[1],z);
    },
    clickToRasLB(nii,ex,ey,vox){
      if(!this._lb) return null;
      const {dx,dy,dw,dh}=this._lb;
      const fx=(ex-dx)/dw, fy=(ey-dy)/dh;
      if(fx<0||fx>1||fy<0||fy>1) return null;
      return this.clickToRas(nii,fx,fy,vox);
    }
  },
  axi: { canvas:null, ctx:null, label:'AXI', color:'#a03af8', _lb:null,
    // axial: cols=X, rows=Y, fixed Z
    getSlice(nii, vox) {
      const zi=Math.round(vox[2]);
      const W=nii.nx, H=nii.ny;
      const px=new Uint8ClampedArray(W*H*4);
      const sc=255/(nii.mx-nii.mn)||1;
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        const v=Math.max(0,Math.min(255,(getVoxel(nii,x,H-1-y,zi)-nii.mn)*sc));
        const i=(y*W+x)*4; px[i]=v;px[i+1]=v;px[i+2]=v;px[i+3]=255;
      }
      return {imageData:new ImageData(px,W,H),
        cx:(vox[0]+0.5)/nii.nx, cy:1-(vox[1]+0.5)/nii.ny,
        physW:nii.nx*nii.pixdim[1], physH:nii.ny*nii.pixdim[2]};
    },
    clickToRas(nii,fx,fy,vox){
      const x=fx*nii.nx-0.5, y=(1-fy)*nii.ny-0.5;
      return voxToRas(nii,x,y,vox[2]);
    },
    clickToRasLB(nii,ex,ey,vox){
      if(!this._lb) return null;
      const {dx,dy,dw,dh}=this._lb;
      const fx=(ex-dx)/dw, fy=(ey-dy)/dh;
      if(fx<0||fx>1||fy<0||fy>1) return null;
      return this.clickToRas(nii,fx,fy,vox);
    }
  }
};

// ── Right panel planes (cursor B) ────────────────────────
// Same structure as planes but for canvases cvs-*-b
const planesB = {
  sag: { canvas:null, ctx:null, label:'SAG', color:'#3af8cc', _lb:null,
    getSlice: planes.sag.getSlice,
    clickToRas: planes.sag.clickToRas,
    clickToRasLB(nii,ex,ey,vox){ if(!this._lb) return null; const {dx,dy,dw,dh}=this._lb; const fx=(ex-dx)/dw,fy=(ey-dy)/dh; if(fx<0||fx>1||fy<0||fy>1) return null; return this.clickToRas(nii,fx,fy,vox); }
  },
  cor: { canvas:null, ctx:null, label:'COR', color:'#f8a03a', _lb:null,
    getSlice: planes.cor.getSlice,
    clickToRas: planes.cor.clickToRas,
    clickToRasLB(nii,ex,ey,vox){ if(!this._lb) return null; const {dx,dy,dw,dh}=this._lb; const fx=(ex-dx)/dw,fy=(ey-dy)/dh; if(fx<0||fx>1||fy<0||fy>1) return null; return this.clickToRas(nii,fx,fy,vox); }
  },
  axi: { canvas:null, ctx:null, label:'AXI', color:'#a03af8', _lb:null,
    getSlice: planes.axi.getSlice,
    clickToRas: planes.axi.clickToRas,
    clickToRasLB(nii,ex,ey,vox){ if(!this._lb) return null; const {dx,dy,dw,dh}=this._lb; const fx=(ex-dx)/dw,fy=(ey-dy)/dh; if(fx<0||fx>1||fy<0||fy>1) return null; return this.clickToRas(nii,fx,fy,vox); }
  }
};

function drawSlice(planeKey, skipSource) {
  if (!state.nii) return;
  const pl = planes[planeKey];
  const cvs = pl.canvas;
  const ctx = pl.ctx;
  const nii = state.nii;
  const vox = rasToVox(nii, ...state.cursor);
  const W=cvs.width, H=cvs.height;

  const {imageData, cx, cy, physW, physH} = pl.getSlice(nii, vox);

  // letterbox: fit physW x physH into W x H preserving aspect ratio
  const scale = Math.min(W/physW, H/physH);
  const dw = physW*scale, dh = physH*scale;
  const dx = (W-dw)/2, dy = (H-dh)/2;

  const offscreen = new OffscreenCanvas(imageData.width, imageData.height);
  offscreen.getContext('2d').putImageData(imageData,0,0);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(offscreen, dx, dy, dw, dh);

  // crosshair in letterboxed space
  const px = dx + cx*dw;
  const py = dy + cy*dh;
  ctx.save();
  ctx.globalAlpha=0.7;
  ctx.strokeStyle=pl.color;
  ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(px,dy); ctx.lineTo(px,dy+dh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dx,py); ctx.lineTo(dx+dw,py); ctx.stroke();
  ctx.restore();

  // store letterbox params on plane for click coordinate mapping
  pl._lb = {dx,dy,dw,dh};
}

function updateSlices(skipSource) {
  for (const k of ['sag','cor','axi']) drawSlice(k, skipSource);
  updateCoordLabels();
}

// slabMultiplier: user-set multiplier × voxel thickness
let slabMultiplier = 2.0;
let endsMm = 0;  // 0 = show full streamline; >0 = only first+last x mm
let probeEndsMm = 0;  // 0 = select any point; >0 = select only by streamline endpoints

function getSlabThickness(planeKey, nii) {
  // half-thickness in VOXELS (depth comparison is now in voxel space)
  return slabMultiplier / 2;
}

function drawSlabOverlay(ctx, planeKey, lb, vox, nii) {
  // Project selected streamlines onto this slice plane.
  // All coordinates go through rasToVox so the affine is respected.
  const {dx,dy,dw,dh} = lb;
  const halfThick = getSlabThickness(planeKey, nii);

  // Out-of-plane voxel index for cursor B
  // sag=vox[0], cor=vox[1], axi=vox[2]
  const planeVoxCoord = planeKey==='sag' ? vox[0]
                      : planeKey==='cor' ? vox[1]
                      : vox[2];

  // Convert a RAS point to canvas pixel via voxel space
  // Matches exactly what getSlice draws: col/row fractions of voxel grid
  function rasToPixel(rx, ry, rz) {
    const [vx,vy,vz] = rasToVox(nii, rx, ry, rz);
    if (planeKey==='sag') {
      return [dx + ((vy+0.5)/nii.ny)*dw,  dy + (1-(vz+0.5)/nii.nz)*dh];
    } else if (planeKey==='cor') {
      return [dx + ((vx+0.5)/nii.nx)*dw,  dy + (1-(vz+0.5)/nii.nz)*dh];
    } else {
      return [dx + ((vx+0.5)/nii.nx)*dw,  dy + (1-(vy+0.5)/nii.ny)*dh];
    }
  }

  ctx.save();
  ctx.lineWidth = 1.2;

  for (const t of selTracts) {
    const n = t.length/3;
    if (n < 2) continue;

    // Precompute cumulative arc-length from start and from end
    // so we can quickly test if a segment is within endsMm of either terminus
    let arcLen = null;
    if (endsMm > 0) {
      arcLen = new Float32Array(n);  // arcLen[i] = distance from point 0 to point i
      for (let i=1; i<n; i++) {
        const dx=t[3*i]-t[3*i-3], dy=t[3*i+1]-t[3*i-2], dz=t[3*i+2]-t[3*i-1];
        arcLen[i] = arcLen[i-1] + Math.sqrt(dx*dx+dy*dy+dz*dz);
      }
    }
    const totalLen = arcLen ? arcLen[n-1] : 0;

    for (let i=0; i<n-1; i++) {
      // Endpoint filter: skip segment if neither endpoint is within endsMm
      // of the start or end of the streamline
      if (endsMm > 0) {
        const fromStart0 = arcLen[i],   fromStart1 = arcLen[i+1];
        const fromEnd0   = totalLen - arcLen[i], fromEnd1 = totalLen - arcLen[i+1];
        const nearStart  = fromStart0 <= endsMm || fromStart1 <= endsMm;
        const nearEnd    = fromEnd0   <= endsMm || fromEnd1   <= endsMm;
        if (!nearStart && !nearEnd) continue;
      }

      const x0=t[3*i],   y0=t[3*i+1],   z0=t[3*i+2];
      const x1=t[3*i+3], y1=t[3*i+4],   z1=t[3*i+5];

      // midpoint in voxel space — depth = out-of-plane voxel distance
      const [mvx,mvy,mvz] = rasToVox(nii, (x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
      const midVox = planeKey==='sag' ? mvx : planeKey==='cor' ? mvy : mvz;
      const depth = midVox - planeVoxCoord;   // in voxels
      const absDep = Math.abs(depth);

      // skip segments too far from slab
      if (absDep > halfThick * 4) continue;

      // brightness: 1.0 in slab, fades beyond halfThick
      let brightness;
      if (absDep <= halfThick) {
        brightness = 1.0;
      } else {
        brightness = Math.max(0.15, 1.0 - (absDep-halfThick)/(halfThick*3));
      }

      // orientation color
      const ddx=Math.abs(x1-x0), ddy=Math.abs(y1-y0), ddz=Math.abs(z1-z0);
      const dl=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz)||1;
      const r=Math.round((ddx/dl)*255*brightness);
      const g=Math.round((ddy/dl)*255*brightness);
      const b=Math.round((ddz/dl)*255*brightness);

      const [px0,py0] = rasToPixel(x0,y0,z0);
      const [px1,py1] = rasToPixel(x1,y1,z1);

      ctx.strokeStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.moveTo(px0,py0);
      ctx.lineTo(px1,py1);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// 3.  SLICE INTERACTION
// ═══════════════════════════════════════════════════════════
function initSliceInteraction(planeKey) {
  const pl = planes[planeKey];
  const cvs = pl.canvas;
  let isDragging = false;

  function clickHandler(e) {
    if (!state.nii) return;
    const rect = cvs.getBoundingClientRect();
    const ex = (e.clientX-rect.left) * (cvs.width/rect.width);
    const ey = (e.clientY-rect.top)  * (cvs.height/rect.height);
    const vox = rasToVox(state.nii, ...state.cursor);
    const newRas = pl.clickToRasLB(state.nii, ex, ey, vox);
    if (newRas) setCursor(newRas, planeKey);
  }

  cvs.addEventListener('mousedown', e=>{ isDragging=true; clickHandler(e); });
  cvs.addEventListener('mousemove', e=>{ if(isDragging) clickHandler(e); });
  document.addEventListener('mouseup', ()=>isDragging=false);

  cvs.addEventListener('wheel', e=>{
    e.preventDefault();
    if (!state.nii) return;
    const nii = state.nii;
    const vox = rasToVox(nii, ...state.cursor);
    const dir = e.deltaY > 0 ? 1 : -1;
    let newVox = [...vox];
    if (planeKey==='sag') newVox[0] = Math.max(0,Math.min(nii.nx-1, vox[0]+dir));
    if (planeKey==='cor') newVox[1] = Math.max(0,Math.min(nii.ny-1, vox[1]+dir));
    if (planeKey==='axi') newVox[2] = Math.max(0,Math.min(nii.nz-1, vox[2]+dir));
    setCursor(voxToRas(nii,...newVox), planeKey);
  }, {passive:false});
}

// 4.  TCK PARSER  (from previous app)
// ═══════════════════════════════════════════════════════════
function sysLE(){const t=new Uint16Array(1);t[0]=348;return new DataView(t.buffer).getUint16(0,true)===348;}
function parseHeader(buf){
  const text=new TextDecoder().decode(new Uint8Array(buf,0,Math.min(8192,buf.byteLength)));
  const lines=text.split('\n'); let h={},key;
  if(!lines.shift().startsWith('mrtrix tracks')) throw 'Not a .tck file';
  for(const line of lines){
    if(line.trim()==='END') break;
    const m=line.match(/([\w\d]+):\s?(.*)/);
    if(m){key=m[1];h[key]=m[2];}else if(key) h[key]+='\n'+line;
  }
  return h;
}
function parseTck(buf){
  const header=parseHeader(buf);
  const byteOffset=parseInt(header.file.split(' ').pop());
  const m=header.datatype.match(/^([a-zA-Z]+)(\d+)([a-zA-Z]+)$/);
  if(!m) throw 'Bad datatype';
  const bpe=parseInt(m[2])/8;
  const Dtype=bpe===4?Float32Array:Float64Array;
  const le=m[3]==='LE';
  let data;
  if(le===sysLE()){
    if(byteOffset%bpe) data=new Dtype(buf.slice(byteOffset));
    else data=new Dtype(buf,byteOffset);
  } else {
    const len=(buf.byteLength-byteOffset)/bpe;
    data=new Dtype(len);
    const dv=new DataView(buf,byteOffset);
    const g='get'+Dtype.name.replace('Array','');
    for(let i=0;i<len;i++) data[i]=dv[g](i*bpe,le);
  }
  const tracts=[],tractForPoint=[];
  let iPrev=0;
  for(let i=0;i<data.length/3;i++){
    const v=data[3*i];
    if(isNaN(v)||!isFinite(v)){
      const len=i-iPrev;
      if(len>0){
        const si=tracts.length;
        const off=data.byteOffset+3*iPrev*data.BYTES_PER_ELEMENT;
        tracts.push(new data.constructor(data.buffer,off,3*len));
        for(let k=0;k<len;k++) tractForPoint.push(si);
      }
      iPrev=i+1;
    }
  }
  return {tracts, tractForPoint:new Int32Array(tractForPoint)};
}

// 5.  GRID SPATIAL INDEX
// ═══════════════════════════════════════════════════════════
class GridIndex {
  constructor(ptsRaw, cellSize) {
    this.pts = (ptsRaw instanceof Float32Array)?ptsRaw:new Float32Array(Array.from(ptsRaw).map(Number));
    const pts=this.pts;
    this.cs=+cellSize;
    let mnx=Infinity,mny=Infinity,mnz=Infinity;
    let mxx=-Infinity,mxy=-Infinity,mxz=-Infinity;
    for(let i=0;i<pts.length;i+=3){
      const x=pts[i],y=pts[i+1],z=pts[i+2];
      if(x<mnx)mnx=x;if(x>mxx)mxx=x;
      if(y<mny)mny=y;if(y>mxy)mxy=y;
      if(z<mnz)mnz=z;if(z>mxz)mxz=z;
    }
    this.min=[mnx,mny,mnz];
    this.dims=[Math.ceil((mxx-mnx)/cellSize)+1,Math.ceil((mxy-mny)/cellSize)+1,Math.ceil((mxz-mnz)/cellSize)+1];
    const D=this.dims,cs=cellSize,n=pts.length/3;
    const ncells=D[0]*D[1]*D[2];
    const count=new Int32Array(ncells);
    for(let i=0;i<n;i++){
      const cx=Math.floor((pts[3*i]-mnx)/cs);
      const cy=Math.floor((pts[3*i+1]-mny)/cs);
      const cz=Math.floor((pts[3*i+2]-mnz)/cs);
      count[cx+cy*D[0]+cz*D[0]*D[1]]++;
    }
    const starts=new Int32Array(ncells+1);
    for(let i=0;i<ncells;i++) starts[i+1]=starts[i]+count[i];
    this.starts=starts;
    this.ptIdx=new Int32Array(n);
    const cur=new Int32Array(ncells);
    for(let i=0;i<n;i++){
      const cx=Math.floor((pts[3*i]-mnx)/cs);
      const cy=Math.floor((pts[3*i+1]-mny)/cs);
      const cz=Math.floor((pts[3*i+2]-mnz)/cs);
      const cell=cx+cy*D[0]+cz*D[0]*D[1];
      this.ptIdx[starts[cell]+cur[cell]]=i;
      cur[cell]++;
    }
  }
  queryRadius(qx,qy,qz,r){
    const cs=this.cs,mn=this.min,D=this.dims,pts=this.pts;
    const starts=this.starts,ptIdx=this.ptIdx,r2=r*r;
    const x0=Math.max(0,Math.floor((qx-r-mn[0])/cs));
    const x1=Math.min(D[0]-1,Math.floor((qx+r-mn[0])/cs));
    const y0=Math.max(0,Math.floor((qy-r-mn[1])/cs));
    const y1=Math.min(D[1]-1,Math.floor((qy+r-mn[1])/cs));
    const z0=Math.max(0,Math.floor((qz-r-mn[2])/cs));
    const z1=Math.min(D[2]-1,Math.floor((qz+r-mn[2])/cs));
    const found=[];
    if(x0>x1||y0>y1||z0>z1) return found;
    for(let cx=x0;cx<=x1;cx++)
    for(let cy=y0;cy<=y1;cy++)
    for(let cz=z0;cz<=z1;cz++){
      const cell=cx+cy*D[0]+cz*D[0]*D[1];
      const s=starts[cell],e=starts[cell+1];
      for(let k=s;k<e;k++){
        const pi=ptIdx[k];
        const dx=pts[3*pi]-qx,dy=pts[3*pi+1]-qy,dz=pts[3*pi+2]-qz;
        if(dx*dx+dy*dy+dz*dz<=r2) found.push(pi);
      }
    }
    return found;
  }
}

const threeCanvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({canvas:threeCanvas, antialias:true});

// ── Inlined TrackballControls ──────────────────────────────
const {EventDispatcher,MathUtils,MOUSE,Quaternion,Vector2,Vector3}=THREE;
class TrackballControls extends EventDispatcher{
  constructor(object,domElement){
    super();
    const scope=this;
    const STATE={NONE:-1,ROTATE:0,ZOOM:1,PAN:2,TOUCH_ROTATE:3,TOUCH_ZOOM_PAN:4};
    this.object=object;this.domElement=domElement;
    this.domElement.style.touchAction='none';
    this.enabled=true;
    this.screen={left:0,top:0,width:0,height:0};
    this.rotateSpeed=2.0;this.zoomSpeed=1.2;this.panSpeed=0.5;
    this.noRotate=false;this.noZoom=false;this.noPan=false;
    this.staticMoving=true;this.dynamicDampingFactor=0.2;
    this.minDistance=0;this.maxDistance=Infinity;
    this.target=new Vector3();
    const EPS=0.000001;
    const lastPosition=new Vector3();let lastZoom=1;
    let _state=STATE.NONE,_keyState=STATE.NONE;
    let _touchZoomDistanceStart=0,_touchZoomDistanceEnd=0,_lastAngle=0;
    const _eye=new Vector3(),_movePrev=new Vector2(),_moveCurr=new Vector2(),
          _lastAxis=new Vector3(),_zoomStart=new Vector2(),_zoomEnd=new Vector2(),
          _panStart=new Vector2(),_panEnd=new Vector2(),
          _pointers=[],_pointerPositions={};
    this.target0=this.target.clone();this.position0=this.object.position.clone();
    this.up0=this.object.up.clone();this.zoom0=this.object.zoom;
    this.handleResize=function(){
      const box=scope.domElement.getBoundingClientRect();
      const d=scope.domElement.ownerDocument.documentElement;
      scope.screen.left=box.left+window.pageXOffset-d.clientLeft;
      scope.screen.top=box.top+window.pageYOffset-d.clientTop;
      scope.screen.width=box.width;scope.screen.height=box.height;
    };
    const getMouseOnScreen=(()=>{const v=new Vector2();
      return(px,py)=>{v.set((px-scope.screen.left)/scope.screen.width,(py-scope.screen.top)/scope.screen.height);return v;};})();
    const getMouseOnCircle=(()=>{const v=new Vector2();
      return(px,py)=>{v.set(((px-scope.screen.width*.5-scope.screen.left)/(scope.screen.width*.5)),
        ((scope.screen.height+2*(scope.screen.top-py))/scope.screen.width));return v;};})();
    this.rotateCamera=(()=>{
      const axis=new Vector3(),quat=new Quaternion(),eyeDir=new Vector3(),
            objUp=new Vector3(),objSide=new Vector3(),moveDir=new Vector3();
      return function(){
        moveDir.set(_moveCurr.x-_movePrev.x,_moveCurr.y-_movePrev.y,0);
        let angle=moveDir.length();
        if(angle){
          _eye.copy(scope.object.position).sub(scope.target);
          eyeDir.copy(_eye).normalize();objUp.copy(scope.object.up).normalize();
          objSide.crossVectors(objUp,eyeDir).normalize();
          objUp.setLength(_moveCurr.y-_movePrev.y);objSide.setLength(_moveCurr.x-_movePrev.x);
          moveDir.copy(objUp.add(objSide));
          axis.crossVectors(moveDir,_eye).normalize();
          angle*=scope.rotateSpeed;quat.setFromAxisAngle(axis,angle);
          _eye.applyQuaternion(quat);scope.object.up.applyQuaternion(quat);
          _lastAxis.copy(axis);_lastAngle=angle;
        }
        _movePrev.copy(_moveCurr);
      };
    })();
    this.zoomCamera=function(){
      const factor=1+(_zoomEnd.y-_zoomStart.y)*scope.zoomSpeed;
      if(factor!==1&&factor>0) _eye.multiplyScalar(factor);
      if(scope.staticMoving)_zoomStart.copy(_zoomEnd);
      else _zoomStart.y+=(_zoomEnd.y-_zoomStart.y)*this.dynamicDampingFactor;
    };
    this.panCamera=(()=>{
      const mc=new Vector2(),objUp=new Vector3(),pan=new Vector3();
      return function(){
        mc.copy(_panEnd).sub(_panStart);
        if(mc.lengthSq()){
          mc.multiplyScalar(_eye.length()*scope.panSpeed);
          pan.copy(_eye).cross(scope.object.up).setLength(mc.x);
          pan.add(objUp.copy(scope.object.up).setLength(mc.y));
          scope.object.position.add(pan);scope.target.add(pan);
          if(scope.staticMoving)_panStart.copy(_panEnd);
          else _panStart.add(mc.subVectors(_panEnd,_panStart).multiplyScalar(scope.dynamicDampingFactor));
        }
      };
    })();
    this.checkDistances=function(){
      if(!scope.noZoom||!scope.noPan){
        if(_eye.lengthSq()>scope.maxDistance**2){scope.object.position.addVectors(scope.target,_eye.setLength(scope.maxDistance));_zoomStart.copy(_zoomEnd);}
        if(_eye.lengthSq()<scope.minDistance**2){scope.object.position.addVectors(scope.target,_eye.setLength(scope.minDistance));_zoomStart.copy(_zoomEnd);}
      }
    };
    this.update=function(){
      _eye.subVectors(scope.object.position,scope.target);
      if(!scope.noRotate)scope.rotateCamera();
      if(!scope.noZoom)scope.zoomCamera();
      if(!scope.noPan)scope.panCamera();
      scope.object.position.addVectors(scope.target,_eye);
      scope.checkDistances();scope.object.lookAt(scope.target);
      if(lastPosition.distanceToSquared(scope.object.position)>EPS) lastPosition.copy(scope.object.position);
      renderer.render(scene,camera);
    };
    function onPointerDown(e){
      if(!scope.enabled)return;
      if(_pointers.length===0){scope.domElement.setPointerCapture(e.pointerId);

        scope.domElement.addEventListener('pointerup',onPointerUp);}
      addPointer(e);
      if(e.pointerType==='touch')onTouchStart(e);else onMouseDown(e);
    }
    function onPointerMove(e){if(!scope.enabled)return;if(e.pointerType==='touch')onTouchMove(e);else onMouseMove(e);}
    function onPointerUp(e){
      if(!scope.enabled)return;
      if(e.pointerType==='touch')onTouchEnd(e);else onMouseUp();
      removePointer(e);
      if(_pointers.length===0){scope.domElement.releasePointerCapture(e.pointerId);
        scope.domElement.removeEventListener('pointermove',onPointerMove);
        scope.domElement.removeEventListener('pointerup',onPointerUp);}
    }
    function onMouseDown(e){
      if(_state===STATE.NONE){
        if(e.button===0)_state=STATE.ROTATE;
        else if(e.button===1)_state=STATE.ZOOM;
        else if(e.button===2)_state=STATE.PAN;
      }
      const st=_state;
      if(st===STATE.ROTATE&&!scope.noRotate){_moveCurr.copy(getMouseOnCircle(e.pageX,e.pageY));_movePrev.copy(_moveCurr);}
      else if(st===STATE.ZOOM&&!scope.noZoom){_zoomStart.copy(getMouseOnScreen(e.pageX,e.pageY));_zoomEnd.copy(_zoomStart);}
      else if(st===STATE.PAN&&!scope.noPan){_panStart.copy(getMouseOnScreen(e.pageX,e.pageY));_panEnd.copy(_panStart);}
      scope.update();
    }
    function onMouseMove(e){
      const st=_state;
      if(st===STATE.ROTATE&&!scope.noRotate){_movePrev.copy(_moveCurr);_moveCurr.copy(getMouseOnCircle(e.pageX,e.pageY));}
      else if(st===STATE.ZOOM&&!scope.noZoom)_zoomEnd.copy(getMouseOnScreen(e.pageX,e.pageY));
      else if(st===STATE.PAN&&!scope.noPan)_panEnd.copy(getMouseOnScreen(e.pageX,e.pageY));
      scope.update();
    }
    function onMouseUp(){_state=STATE.NONE;scope.update();}
    function onMouseWheel(e){
      if(!scope.enabled||scope.noZoom)return;
      e.preventDefault();
      if(e.deltaMode===2)_zoomStart.y-=e.deltaY*0.025;
      else if(e.deltaMode===1)_zoomStart.y-=e.deltaY*0.01;
      else _zoomStart.y-=e.deltaY*0.00025;
      scope.update();
    }
    function onTouchStart(e){
      trackPointer(e);
      if(_pointers.length===1){_state=STATE.TOUCH_ROTATE;_moveCurr.copy(getMouseOnCircle(_pointers[0].pageX,_pointers[0].pageY));_movePrev.copy(_moveCurr);}
      else{_state=STATE.TOUCH_ZOOM_PAN;const dx=_pointers[0].pageX-_pointers[1].pageX,dy=_pointers[0].pageY-_pointers[1].pageY;
        _touchZoomDistanceEnd=_touchZoomDistanceStart=Math.sqrt(dx*dx+dy*dy);
        _panStart.copy(getMouseOnScreen((_pointers[0].pageX+_pointers[1].pageX)/2,(_pointers[0].pageY+_pointers[1].pageY)/2));_panEnd.copy(_panStart);}
      scope.update();
    }
    function onTouchMove(e){
      trackPointer(e);
      if(_pointers.length===1){_movePrev.copy(_moveCurr);_moveCurr.copy(getMouseOnCircle(e.pageX,e.pageY));}
      else{const pos=getSecondPointerPosition(e),dx=e.pageX-pos.x,dy=e.pageY-pos.y;
        _touchZoomDistanceEnd=Math.sqrt(dx*dx+dy*dy);
        _panEnd.copy(getMouseOnScreen((e.pageX+pos.x)/2,(e.pageY+pos.y)/2));}
      scope.update();
    }
    function onTouchEnd(e){
      if(_pointers.length===0)_state=STATE.NONE;
      else if(_pointers.length===1){_state=STATE.TOUCH_ROTATE;_moveCurr.copy(getMouseOnCircle(_pointers[0].pageX,_pointers[0].pageY));_movePrev.copy(_moveCurr);}
      scope.update();
    }
    function addPointer(e){_pointers.push(e);}
    function removePointer(e){delete _pointerPositions[e.pointerId];for(let i=0;i<_pointers.length;i++){if(_pointers[i].pointerId===e.pointerId){_pointers.splice(i,1);return;}}}
    function trackPointer(e){let p=_pointerPositions[e.pointerId];if(!p){p=new Vector2();_pointerPositions[e.pointerId]=p;}p.set(e.pageX,e.pageY);}
    function getSecondPointerPosition(e){const ptr=(e.pointerId===_pointers[0].pointerId)?_pointers[1]:_pointers[0];return _pointerPositions[ptr.pointerId];}
    this.domElement.addEventListener('contextmenu',e=>{if(!scope.enabled)return;e.preventDefault();});
    this.domElement.addEventListener('pointerdown',onPointerDown);
    this.domElement.addEventListener('pointercancel',e=>removePointer(e));
    this.domElement.addEventListener('wheel',onMouseWheel,{passive:false});
    this.handleResize();this.update();
  }
}
const controls = new TrackballControls(camera, threeCanvas);

// ── 3D scene objects ──────────────────────────────────────
let bgMesh=null, selMesh=null, probeSphere=null;
let gridIdx=null, tractForPoint=null, allPts=null, allTracts=null;
let radius=5.0;
let selTracts=[];

function makeEndpointCloud(tracts){
  const pos=new Float32Array(tracts.length*6);
  let vi=0;
  for(const t of tracts){const n=t.length/3;pos[vi++]=t[0];pos[vi++]=t[1];pos[vi++]=t[2];pos[vi++]=t[3*(n-1)];pos[vi++]=t[3*(n-1)+1];pos[vi++]=t[3*(n-1)+2];}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  return new THREE.Points(geo,new THREE.PointsMaterial({size:0.2,color:0x556677,sizeAttenuation:true}));
}
function makeLineSegments(tracts){
  let totalVerts=0;
  for(const t of tracts){const n=t.length/3;if(n>=2)totalVerts+=2*(n-1);}
  const pos=new Float32Array(totalVerts*3),col=new Float32Array(totalVerts*3);
  let vi=0;
  for(const t of tracts){
    const n=t.length/3;if(n<2)continue;
    for(let i=0;i<n-1;i++){
      const x0=t[3*i],y0=t[3*i+1],z0=t[3*i+2],x1=t[3*i+3],y1=t[3*i+4],z1=t[3*i+5];
      const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),dz=Math.abs(z1-z0);
      const l=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      pos[3*vi]=x0;pos[3*vi+1]=y0;pos[3*vi+2]=z0;
      pos[3*vi+3]=x1;pos[3*vi+4]=y1;pos[3*vi+5]=z1;
      col[3*vi]=col[3*vi+3]=dx/l;col[3*vi+1]=col[3*vi+4]=dy/l;col[3*vi+2]=col[3*vi+5]=dz/l;
      vi+=2;
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  return new THREE.LineSegments(geo,new THREE.LineBasicMaterial({vertexColors:true}));
}

function updateProbe(){
  if (!gridIdx) return;
  const [cx,cy,cz]=state.cursor;

  // update or create probe sphere
  if(probeSphere) scene.remove(probeSphere);
  const sg=new THREE.SphereGeometry(radius*0.25,12,8);
  const sm=new THREE.MeshBasicMaterial({color:0xffdd44,wireframe:true});
  probeSphere=new THREE.Mesh(sg,sm);
  probeSphere.position.set(cx,cy,cz);
  scene.add(probeSphere);

  // filter streamlines
  if(selMesh){scene.remove(selMesh);selMesh.geometry.dispose();selMesh=null;}
  let ids;
  if (probeEndsMm <= 0) {
    // standard: any point within radius
    const hitPts=gridIdx.queryRadius(cx,cy,cz,radius);
    const hitSet=new Set();
    for(const pi of hitPts) hitSet.add(tractForPoint[pi]);
    ids=Array.from(hitSet);
  } else {
    // endpoint mode: only streamlines where start or end is within radius
    // AND that endpoint is within probeEndsMm of the streamline terminus
    // Since probeEndsMm filters which part of the streamline counts as an "end",
    // we build an endpoint-only spatial query:
    // collect all points within probeEndsMm arc-length of either terminus,
    // then check if any of those fall within radius of cursor.
    const r2=radius*radius;
    const hitSet=new Set();
    for(let si=0;si<allTracts.length;si++){
      const t=allTracts[si];
      const n=t.length/3;
      if(n<1) continue;
      // accumulate arc-length from start and check each point
      let arcFromStart=0, arcFromEnd=0;
      // check from start
      for(let i=0;i<n;i++){
        if(i>0){
          const dx=t[3*i]-t[3*i-3],dy=t[3*i+1]-t[3*i-2],dz=t[3*i+2]-t[3*i-1];
          arcFromStart+=Math.sqrt(dx*dx+dy*dy+dz*dz);
        }
        if(arcFromStart>probeEndsMm) break;
        const dx=t[3*i]-cx,dy=t[3*i+1]-cy,dz=t[3*i+2]-cz;
        if(dx*dx+dy*dy+dz*dz<=r2){ hitSet.add(si); break; }
      }
      if(hitSet.has(si)) continue;
      // check from end
      for(let i=n-1;i>=0;i--){
        if(i<n-1){
          const dx=t[3*i]-t[3*i+3],dy=t[3*i+1]-t[3*i+4],dz=t[3*i+2]-t[3*i+5];
          arcFromEnd+=Math.sqrt(dx*dx+dy*dy+dz*dz);
        }
        if(arcFromEnd>probeEndsMm) break;
        const dx=t[3*i]-cx,dy=t[3*i+1]-cy,dz=t[3*i+2]-cz;
        if(dx*dx+dy*dy+dz*dz<=r2){ hitSet.add(si); break; }
      }
    }
    ids=Array.from(hitSet);
  }
  selTracts=ids.map(i=>allTracts[i]);
  document.getElementById('stat-sel').textContent=ids.length?`${ids.length.toLocaleString()} selected`:'';
  if(ids.length){
    selMesh=makeLineSegments(selTracts);
    scene.add(selMesh);
  }
  renderer.render(scene,camera);
  updateSlicesB();
}

// ═══════════════════════════════════════════════════════════
// 7.  LOAD HANDLERS
// ═══════════════════════════════════════════════════════════
function setProgress(msg){ document.getElementById('progress').textContent=msg; }
function tick(){ return new Promise(r=>setTimeout(r,20)); }

async function loadNii(file){
  setProgress(`reading ${file.name}…`);
  await tick();
  const buf=await file.arrayBuffer();
  setProgress('parsing NIfTI…');
  await tick();
  try{
    state.nii=await parseNifti(buf);
  }catch(e){alert('NIfTI error: '+e);setProgress('');return;}
  // set initial cursor to centre of volume
  const n=state.nii;
  state.cursor=voxToRas(n, n.nx/2, n.ny/2, n.nz/2);
  state.cursorB=[...state.cursor];
  state.niiLoaded=true;
  setProgress('');
  checkShowHud();
  updateSlices();
}

async function loadTck(buf){
  setProgress('parsing .tck…');
  await tick();
  let parsed;
  try{parsed=parseTck(buf);}catch(e){alert('TCK error: '+e);setProgress('');return;}
  allTracts=parsed.tracts;
  tractForPoint=parsed.tractForPoint;
  const np=tractForPoint.length;
  setProgress(`${allTracts.length.toLocaleString()} streamlines · building index…`);
  await tick();
  allPts=new Float32Array(np*3);
  let off=0;
  for(const t of allTracts){for(let i=0;i<t.length;i++) allPts[off+i]=+t[i];off+=t.length;}
  gridIdx=new GridIndex(allPts,radius);
  setProgress('uploading geometry…');
  await tick();
  if(bgMesh){scene.remove(bgMesh);bgMesh.geometry.dispose();}
  bgMesh=makeEndpointCloud(allTracts);
  scene.add(bgMesh);
  // fit camera
  let cx=0,cy=0,cz=0;
  for(let i=0;i<allPts.length;i+=3){cx+=allPts[i];cy+=allPts[i+1];cz+=allPts[i+2];}
  cx/=np;cy/=np;cz/=np;
  let md=0;
  for(let i=0;i<allPts.length;i+=3){const dx=allPts[i]-cx,dy=allPts[i+1]-cy,dz=allPts[i+2]-cz;const d=dx*dx+dy*dy+dz*dz;if(d>md)md=d;}
  const br=Math.sqrt(md);
  controls.target.set(cx,cy,cz);
  camera.position.set(cx,cy,cz+br*2.5);
  camera.near=br*0.001;camera.far=br*20;
  camera.updateProjectionMatrix();
  document.getElementById('stat-total').textContent=`${allTracts.length.toLocaleString()} streamlines`;
  state.tckLoaded=true;
  setProgress('');
  checkShowHud();
  controls.update();
}

function checkShowHud(){
  if(state.niiLoaded){
    const dz=document.getElementById('dz-nii');
    if(dz) dz.style.display='none';
  }
  if(state.tckLoaded){
    const dz=document.getElementById('dz-tck');
    if(dz) dz.style.display='none';
  }
  if(state.niiLoaded&&state.tckLoaded){
    const ov=document.getElementById('load-overlay');
    if(ov) ov.remove();
  }
  document.getElementById('middle-hud').style.display='block';
}

// 8.  FILE DROP / PICK
// ═══════════════════════════════════════════════════════════
function setupDrop(dzId, inputId, handler){
  const dz=document.getElementById(dzId);
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('over');
    const f=e.dataTransfer.files[0];if(f) handler(f);
  });
  document.getElementById(inputId).addEventListener('change',e=>{
    if(e.target.files[0]) handler(e.target.files[0]);
  });
}
setupDrop('dz-nii','fi-nii',f=>loadNii(f));
setupDrop('dz-tck','fi-tck',f=>{
  const r=new FileReader();
  r.onload=e=>loadTck(e.target.result);
  r.readAsArrayBuffer(f);
});

// Also accept drops anywhere on the page
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(!f) return;
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='tck'){const r=new FileReader();r.onload=ev=>loadTck(ev.target.result);r.readAsArrayBuffer(f);}
  else if(ext==='nii'||ext==='gz') loadNii(f);
});

function resizeSliceCanvasesB() {
  for (const k of ['sag','cor','axi']) {
    const cvs = planesB[k].canvas;
    const row = cvs.closest('.slice-row');
    cvs.width  = row.clientWidth;
    cvs.height = row.clientHeight;
  }
  updateSlicesB();
}

function initSliceInteractionB(planeKey) {
  const pl = planesB[planeKey];
  const cvs = pl.canvas;
  let isDragging = false;
  function clickHandler(e) {
    if (!state.nii) return;
    const rect = cvs.getBoundingClientRect();
    const ex = (e.clientX-rect.left)*(cvs.width/rect.width);
    const ey = (e.clientY-rect.top)*(cvs.height/rect.height);
    const vox = rasToVox(state.nii, ...state.cursorB);
    const newRas = pl.clickToRasLB(state.nii, ex, ey, vox);
    if (newRas) setCursorB(newRas, planeKey);
  }
  cvs.addEventListener('mousedown', e=>{ isDragging=true; clickHandler(e); });
  cvs.addEventListener('mousemove', e=>{ if(isDragging) clickHandler(e); });
  document.addEventListener('mouseup', ()=>isDragging=false);
  cvs.addEventListener('wheel', e=>{
    e.preventDefault();
    if (!state.nii) return;
    const nii=state.nii;
    const vox=rasToVox(nii,...state.cursorB);
    const dir=e.deltaY>0?1:-1;
    let newVox=[...vox];
    if(planeKey==='sag') newVox[0]=Math.max(0,Math.min(nii.nx-1,vox[0]+dir));
    if(planeKey==='cor') newVox[1]=Math.max(0,Math.min(nii.ny-1,vox[1]+dir));
    if(planeKey==='axi') newVox[2]=Math.max(0,Math.min(nii.nz-1,vox[2]+dir));
    setCursorB(voxToRas(nii,...newVox), planeKey);
  },{passive:false});
}
